# 자동 수집: GitHub 서버가 정해진 시간에 수집기를 대신 실행합니다 (무료).
# 레포 Settings → Secrets and variables → Actions 에 DATABASE_URL, ASSEMBLY_API_KEY 등록 필요 (뉴스는 RSS 라 키 없음).
name: collect

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 뉴스 (UTC 기준). Public 레포면 */15 로 줄여도 무료
    - cron: "0 19 * * *"     # 매일 04:00 KST 의원 정보
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 뉴스 수집
        run: npm run collect:news
      - name: 의원 정보 수집 (하루 1회 일정 또는 수동 실행일 때만)
        if: github.event.schedule == '0 19 * * *' || github.event_name == 'workflow_dispatch'
        run: npm run collect:members
      - name: 법안 수집 (의원 정보와 같은 때, 대표 발의 수 갱신)
        if: github.event.schedule == '0 19 * * *' || github.event_name == 'workflow_dispatch'
        run: npx tsx scripts/collectors/bills.ts
